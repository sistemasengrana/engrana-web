<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Engrana Manager</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="/manager/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#F3F5F9;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0F172A}
  body{display:grid;place-items:center}
  .sp{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px}
  .sp img{width:70px;height:70px;animation:gira 2.4s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .sp b{font-size:17px}
  .sp a{display:none;background:#2563EB;color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 18px;border-radius:10px}
  .sp a.ver{display:inline-block}
</style>
</head>
<body>
<div class="sp">
  <img src="/icons/favicon.svg" alt="">
  <b>Abriendo tu Manager…</b>
  <a id="abrir">Abrir Manager</a>
</div>
<script>
(function () {
  'use strict';
  /* Tu Manager necesita tu sesión de Google (sistemasengrana), por eso se abre directo
     en lugar de dentro de esta página (Google no deja usar tu sesión incrustada). */
  var MANAGER = 'https://script.google.com/macros/s/AKfycbzeRpF-4jd1p1vWWt_hS5lYB0vZ3Rb1uOScLwq1YPki/dev?m=1';
  var a = document.getElementById('abrir');
  a.href = MANAGER;
  setTimeout(function () { a.classList.add('ver'); }, 2500);   // por si el navegador no redirige solo
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
  location.replace(MANAGER);
})();
</script>
</body>
</html>
